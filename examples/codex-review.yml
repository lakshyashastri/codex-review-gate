name: Codex review gate
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to recheck
        required: true
        type: string
permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write
concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false
jobs:
  gate:
    name: Update Codex review status
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.user.id == 199175422)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # No checkout: this privileged job must never run code from the PR.
      - uses: lakshyashastri/codex-review-gate@v0.1.0
        with:
          protected-branches: main
          pull-request-number: ${{ inputs.pr }}
